name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -q
      - name: Build demo context pack
        run: python3 repo_context_pruner.py . --max-bytes 50000 --sarif context.sarif || true
